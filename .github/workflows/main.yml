name: Buscar vuelos y publicar

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  buscar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Buscar vuelos a Europa
        run: npm run search
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
            - name: Guardar resultados
        run: |
          git config user.name "eurotrip-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/results.json

          if git diff --cached --quiet; then
            echo "No hay cambios nuevos para guardar."
          else
            git commit -m "Actualizar ofertas de vuelos"

            for intento in 1 2 3; do
              echo "Intento de push $intento de 3..."

              if git push origin HEAD:main; then
                echo "Resultados guardados correctamente."
                break
              fi

              if [ "$intento" -eq 3 ]; then
                echo "No se pudieron guardar los resultados después de 3 intentos."
                exit 1
              fi

              echo "GitHub rechazó temporalmente el push. Reintentando en 10 segundos..."
              sleep 10
            done
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publicar página
        id: deployment
        uses: actions/deploy-pages@v4
